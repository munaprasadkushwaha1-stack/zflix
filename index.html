<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #334155;
        }
        .video-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls-section {
            padding: 20px;
        }
        .server-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #94a3b8;
        }
        .server-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .server-btn {
            flex: 1;
            padding: 12px 16px;
            background: #334155;
            color: #cbd5e1;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .server-btn:hover {
            background: #475569;
            color: #fff;
        }
        .server-btn.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .input-group button {
            padding: 12px 20px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .input-group button:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Video Box -->
    <div class="video-box">
        <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>

    <!-- Controls & Servers -->
    <div class="controls-section">
        <div class="server-title">⚡ Server Choose Karein:</div>
        <div class="server-buttons">
            <button class="server-btn active" onclick="switchServer('okru', this)">
                🌐 Server 1 (Ok.ru)
            </button>
            <button class="server-btn" onclick="switchServer('streamtape', this)">
                📼 Server 2 (Streamtape)
            </button>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrlInput" placeholder="Ok.ru ka link ya embed code daalein...">
            <button onclick="loadVideo()">Play Karein</button>
        </div>
    </div>
</div>

<script>
    let currentServer = 'okru';

    function switchServer(server, btn) {
        currentServer = server;
        document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const input = document.getElementById('videoUrlInput');
        if(server === 'okru') {
            input.placeholder = "Ok.ru ka link ya embed code daalein...";
        } else {
            input.placeholder = "Streamtape ka link ya embed code daalein...";
        }
    }

    function loadVideo() {
        const rawInput = document.getElementById('videoUrlInput').value.trim();
        const iframe = document.getElementById('videoIframe');

        if (!rawInput) {
            alert('Pehle koi valid link ya code enter karein!');
            return;
        }

        let embedUrl = '';

        if (currentServer === 'okru') {
            if (rawInput.includes('<iframe')) {
                const match = rawInput.match(/src="([^"]+)"/);
                embedUrl = match ? match[1] : rawInput;
            } else if (rawInput.includes('ok.ru')) {
                embedUrl = rawInput.replace('/video/', '/videoembed/');
            } else {
                embedUrl = `https://ok.ru/videoembed/${rawInput}`;
            }
        } else if (currentServer === 'streamtape') {
            if (rawInput.includes('<iframe')) {
                const match = rawInput.match(/src="([^"]+)"/);
                embedUrl = match ? match[1] : rawInput;
            } else if (rawInput.includes('streamtape.com')) {
                embedUrl = rawInput.replace('/v/', '/e/');
            } else {
                embedUrl = `https://streamtape.com/e/${rawInput}`;
            }
        }

        iframe.src = embedUrl;
    }
</script>

</body>
</html>
